services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobwork
      POSTGRES_PASSWORD: jobwork
      POSTGRES_DB: jobwork_dev
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobwork']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO deleted its public images in 2026-09; pgsty/silo is the maintained Apache-2.0
  # fork with the same S3 API and MINIO_* variables. Pinned by digest (DO-06).
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: silo server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: jobwork-dev
      MINIO_ROOT_PASSWORD: jobwork-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'

  # minio/mc went with the server images; any S3 client can make the two buckets.
  minio-init:
    image: amazon/aws-cli:2.27.50
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: jobwork-dev
      AWS_SECRET_ACCESS_KEY: jobwork-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://minio:9000 s3 mb s3://jobwork-quarantine || true;
      aws --endpoint-url http://minio:9000 s3 mb s3://jobwork-clean || true;
      exit 0"

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
