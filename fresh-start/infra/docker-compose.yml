services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobwork
      POSTGRES_PASSWORD: jobwork
      POSTGRES_DB: jobwork_dev
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobwork']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: jobwork-dev
      MINIO_ROOT_PASSWORD: jobwork-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 jobwork-dev jobwork-dev-secret; do sleep 1; done;
      mc mb -p local/jobwork-quarantine local/jobwork-clean;
      exit 0"

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
