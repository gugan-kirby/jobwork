name: Nightly

# Doc 23 §4 nightly stage (F-11.5): the suite in UTC, the security suites by name, a
# performance smoke against a booted API, and a dependency audit. The steps live in
# fresh-start/infra/nightly.sh so a red night can be replayed locally with `pnpm nightly`.
on:
  schedule:
    - cron: '30 20 * * *' # 02:00 India time
  workflow_dispatch:

defaults:
  run:
    working-directory: fresh-start

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobwork
          POSTGRES_PASSWORD: jobwork
          POSTGRES_DB: jobwork_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobwork"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://jobwork:jobwork@localhost:5432/jobwork_dev
      SESSION_SECRET: ci-only-secret
      SERVICE_TOKEN_SECRET: ci-only-service-secret
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fresh-start/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: fresh-start/.nvmrc
          cache: pnpm
          cache-dependency-path: fresh-start/pnpm-lock.yaml
      - name: Start the object store
        # MinIO deleted its public images (Docker Hub 2026-09-11; Quay no longer serves them
        # either). pgsty/silo is the maintained Apache-2.0 fork: same S3 API, same MINIO_*
        # variables and /minio/health routes. Its images start no server without arguments,
        # which a service container cannot pass, so it runs as a step. Pinned by digest (DO-06).
        run: |
          docker run -d --name objects -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 silo server /data
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs objects
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm migrate
      - run: pnpm seed
      - name: Install the journeys' browser
        run: pnpm --filter @jobwork/e2e exec playwright install --with-deps chromium
      - run: bash infra/nightly.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: |
            fresh-start/var/perf/
            fresh-start/var/nightly-api.log
            fresh-start/e2e/report/
            fresh-start/e2e/test-results/
          if-no-files-found: ignore
